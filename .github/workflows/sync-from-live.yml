name: Sync from live site
on:
  push:
    paths: [".github/workflows/sync-from-live.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every file the live site serves
        run: |
          set -e
          BASE=https://pokemon-ballclub.vercel.app
          mkdir -p site
          FILES="apple-touch-icon.png brand.css brand.js clubhouse.js core.js data.js development-ui.js development.js evolution-data.js extra.css extra2.css fantasy-season.css fantasy-season.js favicon.png field-flow.js hand.js index.html integrated-stats.css integrated-stats.js items.css items.js logo-hd.avif logo.css logo.webp odds.js pack-foil-v2.webp pack-v2.css pack.css pack.js phase3.css phase3.js phase4.css polish.css polish.js postseason-clean.css postseason-clean.js postseason.css postseason.js reveal.css reveal.js sanity.html sprites.js style.css theme.css ui.js ux.css ux.js ui-review.css"
          for f in $FILES; do
            curl -fsSL "$BASE/$f" -o "site/$f"
          done
          ls -la site | wc -l
          sha1sum site/* > site-shas.txt
      - name: Commit
        run: |
          git config user.name "ballclub-sync"
          git config user.email "ballclub-sync@users.noreply.github.com"
          git add site site-shas.txt
          git commit -m "Import live site from pokemon-ballclub.vercel.app" || echo "nothing to commit"
          git push
